name = "threader"

main = "worker.js"

compatibility_date = "2026-09-28"

workers_dev = true


# ==========================================================
# STATIC WEBSITE
# ==========================================================

[assets]

directory = "./public"

binding = "ASSETS"

# API requests always go through worker.js.
run_worker_first = ["/api/*"]


# ==========================================================
# D1 DATABASE
# ==========================================================

[[d1_databases]]

binding = "DB"

database_name = "threader-db"

database_id = "6610396d-d22d-43c7-a3b8-e4cbc52f3031"


# ==========================================================
# VARIABLES
# ==========================================================

# Don't put your actual secret here.
#
# Set it with:
#
# npx wrangler secret put WORKER_SECRET
#
